<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Sami Guerbouj, IA et Data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#1A5FBF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1A5FBF" stop-opacity="0"/>
    </radialGradient>
    <!-- Voile à gauche : le texte reste lisible au-dessus des lignes -->
    <linearGradient id="voile" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1F3A" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#0B1F3A" stop-opacity="0.6"/>
      <stop offset="0.75" stop-color="#0B1F3A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="carte"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <style>
    .flux { fill: none; stroke: #5B9BF5; stroke-width: 1.3; stroke-linecap: round;
            stroke-dasharray: 6 14; animation: derive 18s linear infinite; }
    @keyframes derive { to { stroke-dashoffset: -400; } }
    @media (prefers-reduced-motion: reduce) { .flux { animation: none; } }
    .nom { font-family: Archivo, 'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif;
           font-weight: 900; font-stretch: condensed; font-size: 82px; fill: #F5F3EE; }
    .texte { font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; fill: #C9D3E2; }
    .tape { font-family: 'Courier Prime', 'Courier New', Courier, monospace; font-weight: 700; }
  </style>

  <g clip-path="url(#carte)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- Lignes de flux : rappel du fond animé de la page IA et Data du portfolio -->
    <path class="flux" opacity="0.18" d="M-20 50 C 240 0, 480 130, 760 80 S 1090 20, 1220 90"/>
    <path class="flux" opacity="0.30" d="M-20 100 C 260 40, 500 180, 780 120 S 1080 70, 1220 140"/>
    <path class="flux" opacity="0.22" d="M-20 150 C 220 100, 520 220, 800 160 S 1100 110, 1220 180"/>
    <path class="flux" opacity="0.36" d="M-20 200 C 280 150, 540 270, 820 200 S 1090 160, 1220 220"/>
    <path class="flux" opacity="0.20" d="M-20 250 C 240 210, 500 310, 780 250 S 1100 200, 1220 260"/>
    <path class="flux" opacity="0.14" d="M-20 295 C 260 260, 520 340, 800 290 S 1080 250, 1220 300"/>
    <rect width="1200" height="320" fill="url(#voile)"/>

    <text class="tape" x="64" y="84" font-size="15" letter-spacing="4" fill="#F5C400">IA · DATA · AUTOMATISATION</text>
    <rect x="64" y="102" width="56" height="4" fill="#F5C400"/>
    <text class="nom" x="62" y="186" textLength="560" lengthAdjust="spacingAndGlyphs">SAMI GUERBOUJ</text>
    <text class="texte" x="64" y="226">Master 2 Intelligence Artificielle et Big Data · ESGI Paris</text>
    <text class="tape" x="64" y="262" font-size="15" letter-spacing="1" fill="#5B9BF5">RAG · Machine learning · Streaming temps réel · BI</text>
  </g>
</svg>
